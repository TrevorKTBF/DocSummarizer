<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fira+Code:wght@300..700&family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&family=Oxanium:wght@200..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
    
    <!-- Passcode Gate Overlay -->
    <style>
      .sf-gate-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.75);
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(4px);
      }
      
      .sf-gate-card {
        background: white;
        border-radius: 12px;
        padding: 32px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        max-width: 400px;
        width: 90%;
        text-align: center;
      }
      
      .sf-gate-title {
        font-size: 24px;
        font-weight: 600;
        color: #1f2937;
        margin-bottom: 8px;
      }
      
      .sf-gate-subtitle {
        color: #6b7280;
        margin-bottom: 24px;
        font-size: 14px;
      }
      
      .sf-gate-input {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 16px;
        margin-bottom: 16px;
        box-sizing: border-box;
      }
      
      .sf-gate-input:focus {
        outline: none;
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      }
      
      .sf-gate-checkbox-container {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
        gap: 8px;
      }
      
      .sf-gate-checkbox {
        width: 16px;
        height: 16px;
      }
      
      .sf-gate-checkbox-label {
        color: #374151;
        font-size: 14px;
        cursor: pointer;
      }
      
      .sf-gate-button {
        width: 100%;
        background-color: #3b82f6;
        color: white;
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      
      .sf-gate-button:hover {
        background-color: #2563eb;
      }
      
      .sf-gate-button:disabled {
        background-color: #9ca3af;
        cursor: not-allowed;
      }
      
      .sf-gate-error {
        color: #ef4444;
        font-size: 14px;
        margin-top: 8px;
        text-align: left;
      }
      
      body.sf-gate-no-scroll {
        overflow: hidden;
      }
    </style>
    
    <script>
      (function() {
        // Check if gate should be shown
        if (localStorage.getItem('sf_gate_ok') === '1') {
          return; // User has already passed the gate
        }
        
        // Prevent body scrolling
        document.body.classList.add('sf-gate-no-scroll');
        
        // Create overlay
        const overlay = document.createElement('div');
        overlay.className = 'sf-gate-overlay';
        overlay.innerHTML = `
          <div class="sf-gate-card">
            <h2 class="sf-gate-title">User Code</h2>
            <form id="sf-gate-form">
              <input 
                type="password" 
                id="sf-gate-passcode" 
                class="sf-gate-input" 
                placeholder="Please enter your code."
                required
                autocomplete="off"
              >
              <div class="sf-gate-checkbox-container">
                <input 
                  type="checkbox" 
                  id="sf-gate-remember" 
                  class="sf-gate-checkbox"
                >
                <label for="sf-gate-remember" class="sf-gate-checkbox-label">Remember me</label>
              </div>
              <button type="submit" class="sf-gate-button">Enter</button>
              <div id="sf-gate-error" class="sf-gate-error" style="display: none;"></div>
            </form>
          </div>
        `;
        
        document.body.appendChild(overlay);
        
        // Focus management
        const passcodeInput = overlay.querySelector('#sf-gate-passcode');
        const rememberCheckbox = overlay.querySelector('#sf-gate-remember');
        const submitButton = overlay.querySelector('.sf-gate-button');
        const form = overlay.querySelector('#sf-gate-form');
        const errorDiv = overlay.querySelector('#sf-gate-error');
        
        // Focus the input
        setTimeout(() => passcodeInput.focus(), 100);
        
        // Trap focus within the overlay
        const focusableElements = [passcodeInput, rememberCheckbox, submitButton];
        let currentFocusIndex = 0;
        
        overlay.addEventListener('keydown', function(e) {
          if (e.key === 'Tab') {
            e.preventDefault();
            if (e.shiftKey) {
              currentFocusIndex = currentFocusIndex > 0 ? currentFocusIndex - 1 : focusableElements.length - 1;
            } else {
              currentFocusIndex = currentFocusIndex < focusableElements.length - 1 ? currentFocusIndex + 1 : 0;
            }
            focusableElements[currentFocusIndex].focus();
          }
        });
        
        // Form submission
        form.addEventListener('submit', function(e) {
          e.preventDefault();
          
          const passcode = passcodeInput.value;
          const isRememberChecked = rememberCheckbox.checked;
          
          // Clear previous error
          errorDiv.style.display = 'none';
          
          // Validate passcode length
          if (passcode.length < 6) {
            errorDiv.textContent = 'Passcode must be at least 6 characters.';
            errorDiv.style.display = 'block';
            return;
          }
          
          // Check if "Remember me" is checked
          if (!isRememberChecked) {
            errorDiv.textContent = 'Please check "Remember me" to continue.';
            errorDiv.style.display = 'block';
            return;
          }
          
          // Success - save to localStorage and remove overlay
          localStorage.setItem('sf_gate_ok', '1');
          document.body.classList.remove('sf-gate-no-scroll');
          overlay.remove();
        });
        
        // Prevent clicking outside to close
        overlay.addEventListener('click', function(e) {
          if (e.target === overlay) {
            e.preventDefault();
            passcodeInput.focus();
          }
        });
      })();
    </script>
  </body>
</html>
